# Adapt workspace globs to the implemented Angular workspace.
packages:
  - 'projects/*'
  - 'apps/*'

# Enforce the preinstalled exact packageManager pin; never auto-download on mismatch.
pmOnFail: error

# Recheck lockfile supply-chain metadata, including contributor-edited locks.
trustLockfile: false

# Supply-chain delay for normal development/release resolution.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExcludePrune: true

# Add only exact version-specific exceptions, with comments explaining the urgent fix.
minimumReleaseAgeExclude:
  # TEMPORARY. Owner grant 2026-10-06 (Ryan Lester) for GHSA-68fv-2mgg-jv7q:
  # 1.2.2 is the only fixed release. Expires 2026-10-07T14:08:09Z (10:08 ET), when
  # it passes the seven-day window on its own; remove this entry then.
  # Record: chainman/minimum-age-exceptions.toml
  - 'source-map-js@1.2.2'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true

overrides:
  # Security pins (FIN-07). http-cache-semantics@4.3.0 remains inside the
  # seven-day window (published 2026-10-04); no owner age exception for it.
  http-cache-semantics: 4.3.0
  source-map-js: 1.2.2
