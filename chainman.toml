schema = 3

# Project-owned launcher. Dependency updates are reserved in
# chainman/future-update-holds.toml and are not declared here, so setup
# and ordinary tasks keep the committed pins.

[project]
name = "ngx-compat-material-legacy"
default_profile = "default"

[profiles.default]
# The official Node tarball needs the host dynamic linker. Container mode
# cannot execute it, so RC tasks use the host Nix mode that can.
allowed_modes = ["host-nix"]
flake = "flake.nix#default"

[setup.javascript]
pnpm = true
profile = "default"
inputs = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "chainman/minimum-age-exceptions.toml",
  ".npmrc",
  "projects/ngx-material-legacy/package.json",
  "nix/tool-sources.json",
  "flake.lock",
  "toolchain-lock.json",
]
artifacts = ["node_modules/.modules.yaml"]

[tasks.toolchain]
commands = [["node", "-v"], ["pnpm", "-v"]]

[tasks.verify]
setup = ["javascript"]
commands = [["python3", "scripts/rc-verify.py"]]

[tasks.pack-draft]
setup = ["javascript"]
commands = [["node", "scripts/pack-draft-run.mjs"]]
