name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helper-checks:
    name: Chainman verify-lite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Install pinned just 1.46.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/just.tar.gz https://github.com/casey/just/releases/download/1.46.0/just-1.46.0-x86_64-unknown-linux-musl.tar.gz
          echo "79966e6e353f535ee7d1c6221641bcc8e3381c55b0d0a6dc6e54b34f9db36eaa  /tmp/just.tar.gz" | sha256sum -c
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo mv /tmp/just /usr/local/bin/just
          just --version

      - name: verify-lite
        run: just verify-lite

      - name: Motion lifecycle smoke
        run: just chainman run motion-smoke

  packed-consumer-aot:
    name: Packed-consumer AOT and harness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Install pinned just 1.46.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/just.tar.gz https://github.com/casey/just/releases/download/1.46.0/just-1.46.0-x86_64-unknown-linux-musl.tar.gz
          echo "79966e6e353f535ee7d1c6221641bcc8e3381c55b0d0a6dc6e54b34f9db36eaa  /tmp/just.tar.gz" | sha256sum -c
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo mv /tmp/just /usr/local/bin/just
          just --version

      - name: Set up JavaScript toolchain
        run: just chainman setup javascript

      - name: Pack a fresh entry run
        id: pack
        run: |
          set -euo pipefail
          # Unique non-draft identity per FIRST-SESSION / FRESH-ARTIFACT.
          # Do not reuse a fixed draft directory (pack-draft cleans a reused dir).
          RUN="artifacts/main/entry-${GITHUB_SHA}"
          test ! -e "$RUN"
          just chainman run pack-draft -- --line main --out "$RUN"
          META="$RUN/pack-meta.json"
          test -f "$META"
          test -f "$RUN/run.json"
          python3 -c "import json; m=json.load(open('$META')); assert m.get('tarball') and m.get('sha256'); print(m.get('source_sha'), m['sha256'][:12], m['tarball'])"
          echo "run_dir=$RUN" >> "$GITHUB_OUTPUT"

      - name: Require the packed export map
        run: |
          set -euo pipefail
          RUN="${{ steps.pack.outputs.run_dir }}"
          tarball=$(python3 -c "import json; print(json.load(open('${RUN}/pack-meta.json'))['tarball'])")
          just chainman exec -- node scripts/check-packed-exports.mjs --tarball "${RUN}/${tarball}"

      - name: Packed-consumer AOT + harness smoke
        run: |
          set -euo pipefail
          RUN="${{ steps.pack.outputs.run_dir }}"
          just chainman run packed-consumer -- --run "${RUN}/run.json"

      - name: Engine-free required consumer against tip pack
        run: |
          set -euo pipefail
          RUN="${{ steps.pack.outputs.run_dir }}"
          tarball=$(python3 -c "import json; print(json.load(open('${RUN}/pack-meta.json'))['tarball'])")
          just chainman exec -- node scripts/engine-free-consumer.mjs --tarball "${RUN}/${tarball}"

      - name: Migration packaged CLI verify and isolation
        run: |
          set -euo pipefail
          just chainman exec -- node scripts/build-migrate-legacy-cli.mjs --verify
          just chainman exec -- node scripts/migration-cli-isolation.mjs

      - name: API completeness against tip pack
        run: |
          set -euo pipefail
          RUN="${{ steps.pack.outputs.run_dir }}"
          just chainman exec -- node scripts/api-completeness.mjs --run "${RUN}/run.json"

      - name: Sass seal against tip pack
        run: |
          set -euo pipefail
          RUN="${{ steps.pack.outputs.run_dir }}"
          just chainman exec -- node scripts/sass-seal.mjs --run "${RUN}/run.json"

      - name: Companion bridge compiled token receipts
        run: |
          set -euo pipefail
          just chainman exec -- node scripts/check-companion-bridges.mjs

      - name: Install Chromium for historical runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Companion rendered computed-style slice
        run: |
          set -euo pipefail
          RUN="${{ steps.pack.outputs.run_dir }}"
          CHROME_BIN="$(command -v chromium-browser || command -v chromium || command -v google-chrome || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          just chainman exec -- node scripts/check-companion-computed-styles.mjs --run "${RUN}/run.json"

      - name: Browser matrix Chromium dialog/select + overlay/form/control families (zoneful/zoneless) slice
        run: |
          set -euo pipefail
          RUN="${{ steps.pack.outputs.run_dir }}"
          CHROME_BIN="$(command -v chromium-browser || command -v chromium || command -v google-chrome || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          just chainman exec -- node scripts/run-browser-matrix-slice.mjs --run "${RUN}/run.json"

      - name: Artifact-bound historical families (all 22)
        run: |
          set -euo pipefail
          RUN="${{ steps.pack.outputs.run_dir }}"
          CHROME_BIN="$(command -v chromium-browser || command -v chromium || command -v google-chrome || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          # One extract + all inventory families; unselected families are not omitted.
          # Host Chrome with Chainman Node; absolute CHROME_BIN avoids flake PATH gaps.
          just chainman run test-legacy -- --run "${RUN}/run.json"

      - name: Upload entry run directory
        if: always() && steps.pack.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: entry-${{ github.sha }}
          path: ${{ steps.pack.outputs.run_dir }}
          if-no-files-found: error
          retention-days: 14


  full-acceptance:
    name: Full acceptance coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Install pinned just 1.46.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/just.tar.gz https://github.com/casey/just/releases/download/1.46.0/just-1.46.0-x86_64-unknown-linux-musl.tar.gz
          echo "79966e6e353f535ee7d1c6221641bcc8e3381c55b0d0a6dc6e54b34f9db36eaa  /tmp/just.tar.gz" | sha256sum -c
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo mv /tmp/just /usr/local/bin/just
          just --version

      - name: Set up JavaScript toolchain
        run: just chainman setup javascript

      - name: Install Chromium, Firefox, and WebKitGTK
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O- | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" | sudo tee /etc/apt/sources.list.d/mozilla.list > /dev/null
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' | sudo tee /etc/apt/preferences.d/mozilla > /dev/null
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium || true
          sudo apt-get install -y firefox
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb bubblewrap xdg-dbus-proxy gsettings-desktop-schemas
          command -v bwrap
          firefox --version
          python3 -c 'import gi; gi.require_version("WebKit2", "4.1"); from gi.repository import WebKit2; print("webkitgtk", WebKit2.get_major_version(), WebKit2.get_minor_version(), WebKit2.get_micro_version())'
          Xvfb :99 -screen 0 1280x900x24 >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "FIREFOX_BIN=$(command -v firefox)" >> "$GITHUB_ENV"
          CHROME_BIN="$(command -v chromium-browser || command -v chromium || command -v google-chrome || true)"
          test -n "$CHROME_BIN"
          test -x "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Run the full verifier
        id: verify
        run: |
          set -euo pipefail
          RUN="artifacts/main/closure-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          test ! -e "$RUN"
          set +e
          just verify --out "$RUN" --line main
          code=$?
          set -e
          printf 'full verify exit: %s\n' "$code"
          echo "run_dir=$RUN" >> "$GITHUB_OUTPUT"
          if [ -f "$RUN/verify-summary.json" ]; then
            python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); c=s.get("completeness") or {}; print("complete_checks:", ", ".join(c.get("complete_checks") or [])); print("automatic_product_result:", c.get("automatic_product_result")); inc=c.get("incomplete_checks") or {}; print("incomplete_count:", len(inc)); [print("incomplete", i, (r or [""])[0]) for i,r in list(inc.items())[:8]]' "$RUN/verify-summary.json" || true
          fi
          # Distinct full-acceptance lane. A nonzero verifier exit stays the job result.
          # That result is incompleteness, not release success.
          exit "$code"

      - name: Upload full-verifier evidence
        if: always() && steps.verify.outputs.run_dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: closure-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ steps.verify.outputs.run_dir }}/verify-summary.json
            ${{ steps.verify.outputs.run_dir }}/reports/packed-exports.json
            ${{ steps.verify.outputs.run_dir }}/evidence/packed-exports
            ${{ steps.verify.outputs.run_dir }}/reports/pack-library.json
            ${{ steps.verify.outputs.run_dir }}/evidence/pack-library
            ${{ steps.verify.outputs.run_dir }}/reports/packed-consumer.json
            ${{ steps.verify.outputs.run_dir }}/evidence/packed-consumer
            ${{ steps.verify.outputs.run_dir }}/reports/engine-free-consumer.json
            ${{ steps.verify.outputs.run_dir }}/evidence/engine-free-consumer
            ${{ steps.verify.outputs.run_dir }}/reports/upstream-audit-disposition.json
            ${{ steps.verify.outputs.run_dir }}/evidence/upstream-audit-disposition
            ${{ steps.verify.outputs.run_dir }}/reports/source-policy.json
            ${{ steps.verify.outputs.run_dir }}/evidence/source-policy
            ${{ steps.verify.outputs.run_dir }}/reports/dependency-eligibility.json
            ${{ steps.verify.outputs.run_dir }}/evidence/dependency-eligibility
            ${{ steps.verify.outputs.run_dir }}/reports/native-motion.json
            ${{ steps.verify.outputs.run_dir }}/evidence/native-motion
            ${{ steps.verify.outputs.run_dir }}/reports/csp-ssr.json
            ${{ steps.verify.outputs.run_dir }}/evidence/csp-ssr
          if-no-files-found: warn
          retention-days: 14
