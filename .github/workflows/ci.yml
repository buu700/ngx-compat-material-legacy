name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helper-checks:
    name: Chainman verify-lite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Install pinned just 1.46.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/just.tar.gz https://github.com/casey/just/releases/download/1.46.0/just-1.46.0-x86_64-unknown-linux-musl.tar.gz
          echo "79966e6e353f535ee7d1c6221641bcc8e3381c55b0d0a6dc6e54b34f9db36eaa  /tmp/just.tar.gz" | sha256sum -c
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo mv /tmp/just /usr/local/bin/just
          just --version

      - name: verify-lite
        run: just verify-lite

      - name: Motion lifecycle smoke
        run: just chainman run motion-smoke

  packed-consumer-aot:
    name: Packed-consumer AOT and harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Install pinned just 1.46.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/just.tar.gz https://github.com/casey/just/releases/download/1.46.0/just-1.46.0-x86_64-unknown-linux-musl.tar.gz
          echo "79966e6e353f535ee7d1c6221641bcc8e3381c55b0d0a6dc6e54b34f9db36eaa  /tmp/just.tar.gz" | sha256sum -c
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo mv /tmp/just /usr/local/bin/just
          just --version

      - name: Set up JavaScript toolchain
        run: just chainman setup javascript

      - name: Pack a fresh entry run
        id: pack
        run: |
          set -euo pipefail
          # Unique non-draft identity per FIRST-SESSION / FRESH-ARTIFACT.
          # Do not reuse a fixed draft directory (pack-draft cleans a reused dir).
          RUN="artifacts/main/entry-${GITHUB_SHA}"
          test ! -e "$RUN"
          just chainman run pack-draft -- --line main --out "$RUN"
          META="$RUN/pack-meta.json"
          test -f "$META"
          test -f "$RUN/run.json"
          python3 -c "import json; m=json.load(open('$META')); assert m.get('tarball') and m.get('sha256'); print(m.get('source_sha'), m['sha256'][:12], m['tarball'])"
          echo "run_dir=$RUN" >> "$GITHUB_OUTPUT"

      - name: Require the packed export map
        run: |
          set -euo pipefail
          RUN="${{ steps.pack.outputs.run_dir }}"
          tarball=$(python3 -c "import json; print(json.load(open('${RUN}/pack-meta.json'))['tarball'])")
          just chainman exec -- node scripts/check-packed-exports.mjs --tarball "${RUN}/${tarball}"

      - name: Packed-consumer AOT + harness smoke
        run: |
          set -euo pipefail
          RUN="${{ steps.pack.outputs.run_dir }}"
          just chainman run packed-consumer -- --run "${RUN}/run.json"

