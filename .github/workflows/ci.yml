name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helper-checks:
    name: Helper tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node from .node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm via corepack
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
          node --version
          npm --version
          pnpm --version

      - name: Helper unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Static script syntax checks
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/bootstrap-material.py \
            scripts/check-toolchain.py \
            scripts/check-upstream-api-policy.py \
            scripts/check-workflow-pins.py \
            scripts/compare-css.py \
            scripts/inspect-packed-package.py \
            scripts/inventory-source.py \
            scripts/list-upstream-deltas.py \
            scripts/seal-reference.py \
            scripts/source-closure.py
          node --check scripts/run-sass-fixtures.mjs
          node --check scripts/run-sass-value-fixtures.mjs

      - name: Workflow action pin checker
        run: python3 scripts/check-workflow-pins.py .

      - name: Toolchain configuration consistency
        run: python3 scripts/check-toolchain.py --root .

      - name: Toolchain runtime versions
        run: python3 scripts/check-toolchain.py --root . --runtime --release
