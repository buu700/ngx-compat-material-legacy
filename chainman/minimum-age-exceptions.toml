# Temporary minimum-release-age exceptions for chainman's javascript setup.
# chainman.toml lists this file and pnpm-workspace.yaml as setup inputs; pnpm
# enforces minimumReleaseAge (10080 minutes) and reads the matching exact
# entry from minimumReleaseAgeExclude. Each exception covers one exact
# package@version, cites the owner grant, and expires no later than the
# moment the release passes the seven-day window on its own.
# scripts/check-dependency-eligibility.py rejects any exclude entry without a
# live, exact, cited record here, and any expired record still configured.
#
# Cleared on 2026-10-13 after natural seven-day windows:
# - source-map-js@1.2.2 (published 2026-09-30T14:08:09Z, window ended 2026-10-07T14:08:09Z)
# - http-cache-semantics@4.3.0 (published 2026-10-04T02:56:05Z, window ended 2026-10-11T02:56:05Z)
# No age exceptions are active. Security overrides for those pins remain in
# pnpm-workspace.yaml.

schema = 1
policy_minimum_age_minutes = 10080
