<ng-template>
  <div
    class="mat-menu-panel"
    [id]="panelId"
    [ngClass]="_classList"
    [class.mat-menu-panel-animations-enabled]="_animationsEnabled"
    [class.mat-menu-panel-exit-animation]="_panelAnimationState === 'void'"
    [class.mat-menu-panel-animating]="_isAnimating"
    (keydown)="_handleKeydown($event)"
    (click)="closed.emit('click')"
    (animationstart)="_onCssAnimationStart($event.animationName)"
    (animationend)="_onCssAnimationDone($event.animationName)"
    tabindex="-1"
    role="menu"
    [attr.aria-label]="ariaLabel || null"
    [attr.aria-labelledby]="ariaLabelledby || null"
    [attr.aria-describedby]="ariaDescribedby || null">
    <div class="mat-menu-content">
      <ng-content></ng-content>
    </div>
  </div>
</ng-template>
