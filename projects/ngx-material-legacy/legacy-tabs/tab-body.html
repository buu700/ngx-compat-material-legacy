<div
  class="mat-tab-body-content"
  #content
  cdkScrollable
  [class.mat-tab-body-content-left]="_position === 'left'"
  [class.mat-tab-body-content-right]="_position === 'right'"
  [class.mat-tab-body-content-can-animate]="
    _position === 'center' ||
    _previousPosition === 'center' ||
    _position === 'left-origin-center' ||
    _position === 'right-origin-center'
  "
  [style.visibility]="_isCenterPosition(_position) ? null : 'hidden'"
  [style.transition-duration]="animationDuration"
  (transitionstart)="_onContentTransitionStart($event)"
  (transitionend)="_onContentTransitionEnd($event)">
  <ng-template matTabBodyHost></ng-template>
</div>
